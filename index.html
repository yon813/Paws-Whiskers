<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Maison Paws — Pet Boutique for Dogs & Cats</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="glass" id="nav">
  <a href="#home" class="logo">Paws&Whiskers</a>

  <div class="links" id="links">
    <a href="#home">Home</a>
    <a href="#shop">Shop</a>
    <a href="#shop-dogs">Dogs</a>
    <a href="#shop-cats">Cats</a>
    <a href="#about">About Us</a>
    <a href="#contact">Contact</a>
  </div>

  <button class="ib" aria-label="Search" onclick="toggleSearch()">
    <svg viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="7"/>
      <path d="M20 20l-4-4"/>
    </svg>
  </button>

  <a class="ib" href="#cart" aria-label="Shopping bag">
    <svg viewBox="0 0 24 24">
      <path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 016 0v2"/>
    </svg>
    <span class="badge" id="cnt">0</span>
  </a>

  <button class="ib" id="burger" aria-label="Menu" onclick="document.getElementById('links').classList.toggle('open')">
    <svg viewBox="0 0 24 24">
      <path d="M4 7h16M4 12h16M4 17h16"/>
    </svg>
  </button>
</nav>

<div id="sbar" class="glass">
  <input id="sq" type="search"
         placeholder="Search beds, treats, toys…"
         aria-label="Search products"
         onkeydown="if(event.key==='Enter')doSearch()">
</div>

<main id="app"></main>

<footer>
  <div class="wrap">
    <div class="cols">

      <div>
        <h3>Maison Paws</h3>
        <p style="opacity:.85;max-width:30ch">
          Carefully selected essentials for dogs and cats.
        </p>

        <div class="soc">
          <a href="#contact" aria-label="Instagram">
            <svg viewBox="0 0 24 24">
              <rect x="4" y="4" width="16" height="16" rx="5"/>
              <circle cx="12" cy="12" r="3.5"/>
            </svg>
          </a>

          <a href="#contact" aria-label="Facebook">
            <svg viewBox="0 0 24 24">
              <path d="M14 8h3V4h-3a4 4 0 00-4 4v3H7v4h3v6h4v-6h3l1-4h-4V8z"/>
            </svg>
          </a>

          <a href="#contact" aria-label="TikTok">
            <svg viewBox="0 0 24 24">
              <path d="M14 4v11a3.5 3.5 0 11-3.5-3.5M14 4c0 2.5 2 4.5 5 4.5"/>
            </svg>
          </a>
        </div>
      </div>

      <div>
        <h3>Shop</h3>
        <a href="#shop">All products</a>
        <a href="#shop-dogs">For dogs</a>
        <a href="#shop-cats">For cats</a>
      </div>

      <div>
        <h3>Company</h3>
        <a href="#about">About us</a>
        <a href="#contact">Contact</a>
        <a href="#contact">FAQs</a>
      </div>

      <div>
        <h3>Visit</h3>
        <p style="opacity:.85">
          hello@maisonpaws.ph<br>
          +63 917 555 0142<br>
          Davao City, Philippines
        </p>
      </div>

    </div>

    <p class="center" style="opacity:.7;margin:28px 0 0;font-size:13px">
      © 2026 Paws&Whiskers. Dogs and cats only.
    </p>
  </div>
</footer>

<div id="toast" role="status"></div>

<script src="script.js"></script>
</body>
</html>
